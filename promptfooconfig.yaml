- description: header.spec.js
  vars:
    testCaseId: '1578420'
    testCaseTitle: Verify Header and Menu functionality (copy)
    steps: |
      1. Navigate to https://test.registertovote.london/ (open the mobile menu first if the responsive nav is collapsed)
         Expected: The 'No Vote No Voice' logo is visible in the header banner (the case's separate "GLA logo" does not exist in the header — it only appears in the footer)
      2. Verify the main navigation shows Home, How to vote, Our work, Resources, Blog, Contact us
         Expected: All 6 links are present and visible
      3. Verify the homepage main heading reads 'Democracy Hub: Every Voice Matters'
         Expected: Heading is visible with that exact text
      4. Verify the three step buttons Register, Voter ID, and Vote are visible and clickable (use exact accessible names to avoid ambiguous matches, e.g. 'Vote' vs 'Voter ID')
         Expected: All three buttons are interactive

      Note: TC-1578420 steps 4-11 (CMS menu-item add/edit/delete/reorder as Site Admin, plus a keyboard-focus sweep) are out of scope for this script — not automated here, same admin-account blocker documented for TC-1578342.
    scriptContent: |
      const { test } = require('@playwright/test');
      const navHelper = require('../helpers/navHelper');

      test('header has logo and top menu links; main heading and step buttons are interactive (reusable helpers)', async ({ page }) => {
        await page.goto('https://test.registertovote.london', { waitUntil: 'domcontentloaded' });

        // open menu if the page has a collapsed responsive menu
        await navHelper.openMenuIfPresent(page);

        // logo
        await navHelper.expectLogoVisible(page);

        // navigation links
        const links = [
          { text: 'Home', href: '/' },
          { text: 'How to vote', href: '/how-to-vote' },
          { text: 'Our work', href: '/our-work' },
          { text: 'Resources', href: '/resources' },
          { text: 'Blog', href: '/blogs-and-news' },
          { text: 'Contact us', href: '/contact-us' },
        ];
        await navHelper.expectNavLinks(page, links);

        // main heading
        await navHelper.expectMainHeading(page, 'Democracy Hub: Every Voice Matters');

