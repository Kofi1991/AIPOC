3) {\n      const mathAnswerInput = allInputs.nth(2);\n      \n      // Get all visible inputs to determine which one is for math\n      let mathInputFound = false;\n      for (let i = 2; i < Math.min(5, inputCount); i++) {\n        const input = allInputs.nth(i);\n        try {\n          const isVisible = await input.isVisible();\n          if (isVisible) {\n            // Get the aria-label or placeholder to check if it's a math input\n            const ariaLabel = await input.getAttribute('aria-label');\n            const placeholder = await input.getAttribute('placeholder');\n            const name = await input.getAttribute('name');\n            \n            console.log(`Input ${i}: aria-label=${ariaLabel}, placeholder=${placeholder}, name=${name}`);\n            \n            // Try to fill this input\n            // First extract the math question from page\n            const bodyText = await page.locator('body').textContent();\n            const mathMatch = bodyText.match(/Solve this simple math problem.*?(\\d+)\\s*([\\+\\-\\*\\/])\\s*(\\d+)/i);\n            \n            if (mathMatch) {\n              const [, num1, operator, num2] = mathMatch;\n              let answer;\n              \n              switch (operator.trim()) {\n                case '+':\n                  answer = parseInt(num1) + parseInt(num2);\n                  break;\n                case '-':\n                  answer = parseInt(num1) - parseInt(num2);\n                  break;\n                case '*':\n                  answer = parseInt(num1) * parseInt(num2);\n                  break;\n                case '/':\n                  answer = Math.floor(parseInt(num1) / parseInt(num2));\n                  break;\n                default:\n                  answer = 0;\n              }\n              \n              console.log(`✓ Math problem: ${num1} ${operator.trim()} ${num2} = ${answer}`);\n              \n              await input.focus();\n              await input.fill(String(answer));\n              await page.waitForTimeout(300);\n              \n              const filledValue = await input.inputValue();\n              if (filledValue === String(answer)) {\n                console.log(`✓ Math answer ${answer} successfully entered`);\n                mathInputFound = true;\n                break;\n              }\n            }\n          }\n        } catch (e) {\n          // Continue to next input\n        }\n      }\n      \n      if (!mathInputFound) {\n        console.log('⚠ Could not determine which input is for math answer');\n      }\n    }\n  }\n  \n  // Click login button again to submit with math answer\n  await loginButton.click();\n  console.log('✓ Login submitted with math answer');\n  \n  // Wait for redirect after successful login\n  try {\n    await page.waitForURL(url => !url.includes('/user/login'), { timeout: 5000 });\n    console.log('✓ Successfully logged in and redirected');\n  } catch (e) {\n    console.log('⚠ Login may have failed or no redirect occurred');\n    // Check if we're still on the login page\n    const currentUrl = page.url();\n    if (currentUrl.includes('/user/login')) {\n      throw new Error('Login failed - still on login page after submitting credentials');\n    }\n  }\n}\n\n// Standard login helper for valid credentials: fills the form, submits, answers the\n// anti-bot math challenge if it appears (retrying up to 5 times), and asserts the\n// login succeeded (navigated away from /user/login). Use this for any flow that\n// needs a real, logged-in session.\nasync function login(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  // The anti-bot math challenge appears after a submit and clears the password field, so the\n  // password has to be re-entered alongside the answer. It can reappear with a new question on\n  // consecutive submits, so keep answering it until it clears or we give up retrying.\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n\n  await expect(page).not.toHaveURL(/\\/user\\/login/);\n}\n\n// Login helper for credentials expected to FAIL (e.g. wrong password, fake account).\n// Same anti-bot retry pattern as login(), but does not assert success — the caller\n// asserts on whatever error state results instead.\nasync function attemptInvalidLogin(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n}\n\n// Logs out by navigating directly to the logout URL (Drupal ends the session on GET).\nasync function logout(page) {\n  await page.goto('https://test.registertovote.london/user/logout', { waitUntil: 'domcontentloaded' });\n}\n\n// From an already-logged-in page, navigates through \"Add content\" > \"News article /\n// Blog post\" to reach the blog creation form. Tries several selector fallbacks at each\n// step since the exact link/button markup isn't guaranteed.\nasync function navigateToBlogCreation(page) {\n  // Wait for page to stabilize\n  await page.waitForTimeout(1000);\n  \n  // Look for \"Add content\" menu item or button - check both links and buttons\n  const addContentLocators = [\n    page.getByRole('link', { name: 'Add content' }),\n    page.getByRole('button', { name: 'Add content' }),\n    page.locator('a[href*=\"/node/add\"]'), // no accessible name to match on; href is the only signal\n    page.getByRole('link', { name: 'Add' }),\n  ];\n\n  let addContentClicked = false;\n  for (const locator of addContentLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"Add content\"');\n      addContentClicked = true;\n      await page.waitForTimeout(500);\n      break;\n    }\n  }\n  \n  if (!addContentClicked) {\n    throw new Error('Could not find \"Add content\" button/link');\n  }\n  \n  // Click on \"News article / Blog post\" option\n  const blogPostLocators = [\n    page.getByRole('link', { name: 'News article' }),\n    page.getByRole('link', { name: 'Blog post' }),\n    page.getByRole('link', { name: /News article.*Blog post|Blog post.*News/ }),\n    page.locator('li').filter({ hasText: /News article.*Blog post|Blog post/ }), // no interactive role on a bare <li>\n  ];\n\n  let found = false;\n  for (const locator of blogPostLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"News article / Blog post\"');\n      found = true;\n      break;\n    }\n  }\n  \n  if (!found) {\n    throw new Error('Could not find \"News article / Blog post\" option');\n  }\n  \n  // Wait for blog creation form to load\n  await page.waitForSelector('form, input[type=\"text\"]', { timeout: 5000 });\n  console.log('✓ Blog creation form loaded');\n}\n\n// loginWithMathChallenge: legacy, heuristic-based login (see comment above it)\n// login: standard login for valid credentials, asserts success\n// attemptInvalidLogin: login for credentials expected to fail, no success assertion\n// logout: ends the session\n// navigateToBlogCreation: from a logged-in page, reaches the blog creation form\nmodule.exports = {\n  loginWithMathChallenge,\n  login,\n  attemptInvalidLogin,\n  logout,\n  navigateToBlogCreation,\n};\n\n// tests/helpers/contentPageHelper.js\nconst { expect } = require('@playwright/test');\n\nasync function openGenericPageForm(page) {\n  await page.goto('https://test.registertovote.london/node/add', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('link', { name: 'Generic page' }).click();\n  await expect(page.getByRole('heading', { name: 'Create Generic page' })).toBeVisible();\n}\n\nasync function expectGenericPageFieldRequirements(page) {\n  await expect(page.getByRole('textbox', { name: 'Title *' })).toBeVisible();\n  await expect(page.getByRole('textbox', { name: 'Summary *' })).toBeVisible();\n  await expect(page.getByRole('application', { name: 'Rich Text Editor' })).toBeVisible();\n}\n\nasync function createGenericPage(page, title, summary) {\n  await page.getByRole('textbox', { name: 'Title *' }).fill(title);\n  await page.getByRole('textbox', { name: 'Summary *' }).fill(summary);\n  await page.getByRole('button', { name: 'Save & Close' }).first().click();\n}\n\nmodule.exports = {\n  openGenericPageForm,\n  expectGenericPageFieldRequirements,\n  createGenericPage,\n};\n"
