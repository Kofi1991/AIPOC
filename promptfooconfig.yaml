        const possibleMenuButtons = [
          page.getByRole('button', { name: /Menu/i }),
          page.getByRole('button', { name: /Open menu/i }),
          page.getByRole('button', { name: /Close/i }),
        ];
        for (const btn of possibleMenuButtons) {
          try {
            if (await btn.isVisible()) {
              await btn.click();
              return true;
            }
          } catch (e) {
            // ignore — button not found
          }
        }
        return false;
      }

      async function expectLogoVisible(page, altText = 'No Vote No Voice home page') {
        // Try multiple strategies to locate a logo to reduce flakiness across browsers
        const altLogo = page.getByAltText(altText);
        if ((await altLogo.count()) > 0) {
          // If the element exists but isn't visible within a short timeout, accept its presence
          try {
            await expect(altLogo).toBeVisible({ timeout: 5000 });
            return;
          } catch (e) {
            // element exists but not visible; fall through and validate src attribute
            const src = await altLogo.getAttribute('src');
            if (src) return;
          }
        }

        const homeImg = page.locator('a[href="/"] img').first();
        if ((await homeImg.count()) > 0) {
          try {
            await expect(homeImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await homeImg.getAttribute('src');
            if (src) return;
          }
        }

        const headerImg = page.locator('header img').first();
        if ((await headerImg.count()) > 0) {
          try {
            await expect(headerImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await headerImg.getAttribute('src');
            if (src) return;
          }
        }

        const anyLogo = page.locator('img[alt*="logo" i], img[alt*="home" i]').first();
        if ((await anyLogo.count()) > 0) {
          try {
            await expect(anyLogo).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await anyLogo.getAttribute('src');
            if (src) return;
          }
        }

        // As a last resort, look for the first image inside banner/nav
        const bannerImg = page.locator('banner img, .banner img, nav img, header [role="img"]').first();
        if ((await bannerImg.count()) > 0) {
          try {
            await expect(bannerImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await bannerImg.getAttribute('src');
            if (src) return;
          }
        }

        throw new Error('Logo not found using any fallback locator');
      }

      // Clicks the header logo. Scoped to the site-branding block and the image-wrapping
      // link specifically — the header also has a second, text-only link sharing the same
      // accessible name, and getByAltText doesn't resolve here despite the accessible name
      // matching (the img's alt attribute isn't what a11y tooling reports as its name).
      async function clickLogo(page, altText = 'No Vote No Voice home page') {
        await page
          .locator('#block-dhub-starterkit-novotenovoice')
          .getByRole('link', { name: altText })
          .click();
      }

      async function getMainNav(page) {
        try {
          const nav = page.getByRole('navigation', { name: /Main navigation/i });
          await expect(nav).toBeVisible();
          return nav;
        } catch (e) {
          // fallback to first nav on page (native <nav> elements carry an implicit
          // "navigation" role, so this stays role-based rather than a CSS selector)
          const navFallback = page.getByRole('navigation').first();
          await expect(navFallback).toBeVisible();
          return navFallback;
        }
      }

      async function expectNavLinks(page, links) {
        const nav = await getMainNav(page);
        for (const item of links) {
          const link = nav.getByRole('link', { name: new RegExp(`^${item.text}$`, 'i') });
          await expect(link).toBeVisible();
          if (item.href) {
            await expect(link).toHaveAttribute('href', item.href);
          }
        }
      }

      const MAIN_NAV_LINKS = [
        { text: 'Home', href: '/' },
        { text: 'How to vote', href: '/how-to-vote' },
        { text: 'Our work', href: '/our-work' },
        { text: 'Resources', href: '/resources' },
        { text: 'Blog', href: '/blogs-and-news' },
        { text: 'Contact us', href: '/contact-us' },
      ];

      // Verifies the header banner: logo, main nav landmark + all 6 links, and the search box.
      async function expectHeaderBanner(page) {
        await expectLogoVisible(page);
        const nav = await getMainNav(page);
        await expect(nav).toBeVisible();
        await expectNavLinks(page, MAIN_NAV_LINKS);
        await expect(page.getByRole('textbox', { name: 'Search' })).toBeVisible();
      }

      // Navigates to fromUrl, clicks the header logo, and confirms it returns to the homepage.
      async function expectLogoNavigatesHome(page, fromUrl, homeUrl = 'https://test.registertovote.london/') {
        await page.goto(fromUrl);
        await clickLogo(page);
        await expect(page).toHaveURL(homeUrl);
      }

      async function expectMainHeading(page, headingText) {
        const mainHeading = page.getByRole('heading', { name: new RegExp(headingText, 'i') });
        await expect(mainHeading).toBeVisible();
      }

      function escapeForRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      async function expectStepButtonsClickable(page, buttonNames) {
        for (const nameOrRegex of buttonNames) {
          let locator;
          if (typeof nameOrRegex === 'string') {
            // Try several fallback strategies to find the step control reliably across layouts:
            // 1) a button that contains a heading with the exact name (handles 'Step X' wrappers)
            // 2) a link that contains that heading (sometimes steps are links, not buttons)
            // 3) an exact button by accessible name
            // 4) an exact link by accessible name
            // 5) exact text match anywhere
            const anchoredHeading = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
            const heading = page.getByRole('heading', { name: anchoredHeading }).first();

            // 1) button ancestor of heading
            try {
              const buttonContainingHeading = page.getByRole('button').filter({ has: heading }).first();
              if ((await buttonContainingHeading.count()) > 0) locator = buttonContainingHeading;
            } catch (e) { /* ignore */ }

            // 2) link ancestor of heading
            if (!locator) {
              try {
                const linkContainingHeading = page.getByRole('link').filter({ has: heading }).first();
                if ((await linkContainingHeading.count()) > 0) locator = linkContainingHeading;
              } catch (e) { /* ignore */ }
            }

            // 3) exact button by accessible name
            if (!locator) {
              const anchored = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
              const byButton = page.getByRole('button', { name: anchored }).first();
              if ((await byButton.count()) > 0) locator = byButton;
            }

            // 4) exact link by accessible name
            if (!locator) {
              const anchored = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
              const byLink = page.getByRole('link', { name: anchored }).first();
              if ((await byLink.count()) > 0) locator = byLink;
            }

            // 5) fallback to exact text match
            if (!locator) {
              locator = page.getByText(new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i')).first();
            }
          } else {
            locator = page.getByRole('button', { name: nameOrRegex });
          }

          // If the locator resolves to multiple elements, pick the visible one
          const count = await locator.count().catch(() => 0);
          if (count > 1) {
            // prefer the first visible
            let found = false;
            for (let i = 0; i < count; i++) {
              const el = locator.nth(i);
              if (await el.isVisible()) {
                locator = el;
                found = true;
                break;
              }
            }
            if (!found) {
              // fall back to the first
              locator = locator.first();
            }
          }

          await expect(locator).toBeVisible();
          await expect(locator).toBeEnabled();
          // prevent navigation while testing clickability
          await locator.evaluate((el) => {
            el.addEventListener('click', (e) => e.preventDefault(), { once: true });
            el.click();
          });
        }
      }

      module.exports = {
        openMenuIfPresent,
        expectLogoVisible,
        clickLogo,
        getMainNav,
        expectNavLinks,
        expectHeaderBanner,
        expectLogoNavigatesHome,
        expectMainHeading,
        expectStepButtonsClickable,
      };

      // tests/helpers/resourcesHelper.js
      const { expect } = require('@playwright/test');
      const { expectNavLinks } = require('./navHelper');

      const RESOURCES_URL = 'https://test.registertovote.london/resources';
      const BSL_LINK_HREF =
        'https://www.registertovote.london/resources?search=&category_theme=All&language=78&field_resource_type=All&field_resource_format=All';

      async function resetResources(page) {
        await page.goto(RESOURCES_URL);
      }

      async function expectResourcesIntro(page) {
        await expect(page.getByText('Are you looking for resources')).toBeVisible();
        const bulletList = page.locator('ul').filter({ hasText: 'social media toolkits' });
        await expect(bulletList).toMatchAriaSnapshot(`
          - list:
            - listitem: social media toolkits
            - listitem: print materials in English in community languages
            - listitem:
              - text: resources for Deaf and disabled Londoners, including in
              - link "British Sign Language":
                - /url: ${BSL_LINK_HREF}
            - listitem:
              - text: answers to Frequently Asked Questions in English,
              - link "Easy Read":
                - /url: /resources/faq-easy-read
              - text: and community languages
            - listitem: annual evaluation reports into our projects and campaigns
            - listitem: research reports that inform our work
        `);
      }

      async function expectBslLinkHref(page) {
        await expect(page.getByRole('link', { name: 'British Sign Language' })).toHaveAttribute('href', BSL_LINK_HREF);
      }

      async function clickEasyReadLink(page) {
        await page.getByRole('link', { name: 'Easy Read', description: 'FAQ - Easy Read' }).click();
      }

      // The shared header "Search" field is a different control from the page's own
      // "Search resources" field below. tests/helpers/searchHelper.js targets `#edit-search`,
      // which doesn't match this field — use the placeholder locator instead.
      function headerSearchInput(page) {
        return page.getByPlaceholder('Search', { exact: true });
      }

      async function searchResources(page, term) {
        const input = page.getByPlaceholder('Search resources');
        await input.fill(term);
        await input.press('Enter');
      }

      async function expectNoResults(page) {
        await expect(page.locator('article article')).toHaveCount(0);
        await expect(page.getByRole('navigation', { name: 'Pagination' })).toHaveCount(0);
        await expect(page.getByRole('listbox', { name: 'Category' })).toBeVisible();
      }

      function filterWidget(page, filterName) {
        return page.getByRole('listbox', { name: filterName });
      }

      // Opens the Choices.js filter widget and clicks its real first selectable option
      // (skipping the "- Any -" and placeholder entries). Returns the option's label text.
      // Maps a filter's accessible name to its URL query-param key.
      const FILTER_PARAM = {
        Category: 'category_theme',
        Language: 'language',
        Type: 'field_resource_type',
        Format: 'field_resource_format',
      };

      async function selectFirstFilterOption(page, filterName) {
        const widget = filterWidget(page, filterName);
        await expect(widget).toBeVisible();
        await widget.click();
        const options = widget.getByRole('option');
        // The panel's real option list only renders after Choices.js opens it; wait for
        // more than the single always-present placeholder option before reading them.
        await expect(async () => {
          expect(await options.count()).toBeGreaterThan(1);
        }).toPass({ timeout: 10000 });
        const count = await options.count();
        for (let i = 0; i < count; i++) {
          const label = (await options.nth(i).textContent())?.trim();
          if (label && label !== '- Any -' && label !== filterName) {
            await options.nth(i).click();
            return label;
          }
        }
        throw new Error(`No selectable option found for filter '${filterName}'`);
      }

      async function expectFiltersReset(page) {
        for (const name of ['Category', 'Language', 'Type', 'Format']) {
          await expect(filterWidget(page, name)).toContainText(name);
        }
      }

      // Returns the link locator for the first resource card, after asserting it has
      // a non-empty heading, at least one tag/label, and a real (non-'#') href.
      function resourceCards(page) {
        return page.locator('article article');
      }

      async function expectFirstCardValid(page) {
        const firstCard = resourceCards(page).first();
        await expect(firstCard.getByRole('heading', { level: 2 })).not.toBeEmpty();
        const link = firstCard.getByRole('link').first();
        const href = await link.getAttribute('href');
        expect(href).toBeTruthy();
        expect(href).not.toBe('#');
        return link;
      }

      // Selects the given filter's real first option from a fresh page load and
      // returns the resulting URL param value — avoids chaining two live widget
      // interactions back-to-back, which races with Choices.js re-initializing
      // after the first selection's full-page navigation.
      async function captureFilterParamValue(page, filterName) {
        await resetResources(page);
        await selectFirstFilterOption(page, filterName);
        const url = new URL(page.url());
        return url.searchParams.get(FILTER_PARAM[filterName]);
      }

      async function expectResourcesPageLoaded(page) {
        await expect(page.getByRole('heading', { name: 'Resources', level: 1 })).toBeVisible();
        await expect(page.getByRole('navigation', { name: 'Breadcrumb' })).toContainText('Resources');
        await expectNavLinks(page, [
          { text: 'Home', href: '/' },
          { text: 'How to vote', href: '/how-to-vote' },
          { text: 'Our work', href: '/our-work' },
          { text: 'Resources', href: '/resources' },
          { text: 'Blog', href: '/blogs-and-news' },
          { text: 'Contact us', href: '/contact-us' },
        ]);
        await expect(page.getByRole('link', { name: 'Go to language selector' })).toBeVisible();
      }

      async function expectInlineLinksWork(page) {
        await expectBslLinkHref(page);
        await clickEasyReadLink(page);
        await expect(page).toHaveURL(/\/resources\/faq-easy-read$/);
        await page.goBack();
      }

      async function expectHeaderSearchWorks(page) {
        const headerSearch = headerSearchInput(page);
        await headerSearch.fill('voter ID');
        await expect(headerSearch).toHaveValue('voter ID');
        await headerSearch.fill('');
        await expect(headerSearch).toHaveValue('');
      }

      async function expectResourcesSearchWorks(page) {
        await searchResources(page, 'voting');
        await expect(page).toHaveURL(/search=voting/);
        await expect(page.getByRole('heading', { name: /Voting/i }).first()).toBeVisible();
        await resetResources(page);
        await expect(page.getByRole('heading', { name: 'FAQ - English' })).toBeVisible();
        await searchResources(page, 'zzzznoresults123');
        await expectNoResults(page);
      }

      async function expectAllFiltersWork(page) {
        for (const filterName of ['Category', 'Language', 'Type', 'Format']) {
          await resetResources(page);
          const selected = await selectFirstFilterOption(page, filterName);
          await expect(filterWidget(page, filterName)).toContainText(selected);
        }
      }

      async function expectCombinedFilterWorks(page) {
        const categoryValue = await captureFilterParamValue(page, 'Category');
        const formatValue = await captureFilterParamValue(page, 'Format');
        await page.goto(
          `${RESOURCES_URL}?search=&category_theme=${categoryValue}&language=All&field_resource_type=All&field_resource_format=${formatValue}`
        );
        await expect(page).toHaveURL(new RegExp(`category_theme=${categoryValue}`));
        await expect(page).toHaveURL(new RegExp(`field_resource_format=${formatValue}`));
      }

      async function expectFiltersResetToDefault(page) {
        await resetResources(page);
        await expectFiltersReset(page);
        await expect(page.getByRole('heading', { name: 'FAQ - English' })).toBeVisible();
      }

      async function expectFirstCardNavigatesAndBack(page) {
        const firstCardLink = await expectFirstCardValid(page);
        await firstCardLink.click();
        await expect(page).not.toHaveURL(new RegExp(`${RESOURCES_URL}$`));
        await page.goBack();
        await expect(page).toHaveURL(RESOURCES_URL);
      }

      module.exports = {
        RESOURCES_URL,
        FILTER_PARAM,
        captureFilterParamValue,
        resetResources,
        expectResourcesIntro,
        expectBslLinkHref,
        clickEasyReadLink,
        headerSearchInput,
        searchResources,
        expectNoResults,
        filterWidget,
        selectFirstFilterOption,
        expectFiltersReset,
        resourceCards,
        expectFirstCardValid,
        expectResourcesPageLoaded,
        expectInlineLinksWork,
        expectHeaderSearchWorks,
        expectResourcesSearchWorks,
        expectAllFiltersWork,
        expectCombinedFilterWorks,
        expectFiltersResetToDefault,
        expectFirstCardNavigatesAndBack,
      };
  assert:
  - type: llm-rubric
    value: |-
      The output should be a Playwright test script (JavaScript) that automates TestCollab case TC-1578303 ("Verify Resources dropdown navigation"). It should:
      - Cover every numbered step above and assert its "Expected" outcome using Playwright's expect().
      - Prefer accessible locators (getByRole, getByLabel, getByText) over raw CSS or XPath selectors.
      - Not hardcode any credentials or secrets as literal strings; read them from environment variables if login is required.
      - Use awaited async Playwright APIs throughout (no dangling promises).

      For reference, here is the existing script already implemented in this repository for this test case. Use it, and the helper module(s) below that it imports, as additional context on established locator patterns, real page structure, and behavior already verified live in this codebase. The output does not need to match this reference verbatim, but should be at least as correct and should not contradict verified facts recorded in the helpers (e.g. real hrefs, accessible names, or field requirements):

      --- Existing script: verify-resources-dropdown-navigation.spec.js ---
      {{scriptContent}}

      --- Imported helper module(s) ---
      {{helperContent}}
- description: verify-successful-creation-of-news-article-blog-post-with-all-required-fields.spec.js
  vars:
    testCaseId: '1578624'
    testCaseTitle: Verify successful creation of News article / Blog post with all required fields
    steps: |
      1. Navigate to the login page at test.registertovote.london
         Expected: Login page is displayed with Username and Password fields
      2. Enter a valid username in the Username field
         Expected: Username is accepted in the field
      3. Enter the corresponding valid password in the Password field
         Expected: Password is accepted in the field
      4. Click the Log in button
         Expected: Math (anti-bot) question appears
      5. Solve the maths question
         Expected: Answer is inserted into the box
      6. Re-enter the password (form re-prompts after the math challenge)
         Expected: Password is accepted in the field
      7. Click the Log in button
         Expected: User is authenticated and redirected to the dashboard or home page
      8. Navigate to Add content > News article / Blog post
         Expected: Create News article / Blog post form is displayed
      9. Enter a valid title in the Title field
         Expected: Title is accepted in the field
      10. Enter content in the Summary field
         Expected: Summary text is accepted
      11. Click Add media button and upload an image
         Expected: Image is uploaded and displayed in the Image section
      12. Enter body content using the rich text editor
         Expected: Body content is saved with formatting
      13. Click Save & Close button
         Expected: Blog post is created successfully and user is redirected to the content view
    scriptContent: "// spec: specs/tc-1578624-news-article-blog-post-plan.md\n// seed: tests/seed.spec.ts\n\nconst { test, expect } = require('@playwright/test');\nconst path = require('path');\nconst authHelper = require('../helpers/authHelper');\nconst blogPostHelper = require('../helpers/blogPostHelper');\n\ntest('Verify successful creation of News article / Blog post with all required fields', async ({ page }) => {\n  // Test credentials from TC-1455\n  const username = process.env.TC_ADMIN_USER;\n  const password = process.env.TC_ADMIN_PASS;\n  \n  // Blog post test data\n  const blogPostTitle = 'Test Blog Post: Democracy in Action';\n  const blogPostSummary = 'This is a test summary for the blog post about democratic engagement and civic participation.';\n  const blogPostBody = 'This is the main body content of the blog post. It contains detailed information about the topic with proper formatting and structure.';\n  \n  // Step 1-7: Login with math challenge\n  console.log('Step 1-7: Logging in with math challenge...');\n  await authHelper.loginWithMathChallenge(page, username, password);\n  console.log('✓ Successfully logged in');\n  \n  // Step 8: Navigate to Add content > News article / Blog post\n  console.log('Step 8: Navigating to blog creation form...');\n  await authHelper.navigateToBlogCreation(page);\n  console.log('✓ Blog creation form displayed');\n  \n  // Step 9: Enter a valid title in the Title field\n  console.log('Step 9: Entering blog post title...');\n  await blogPostHelper.fillBlogPostTitle(page, blogPostTitle);\n  console.log('✓ Title accepted');\n  \n  // Step 10: Enter content in the Summary field\n  console.log('Step 10: Entering blog post summary...');\n  await blogPostHelper.fillBlogPostSummary(page, blogPostSummary);\n  console.log('✓ Summary accepted');\n  \n  // Step 11: Click Add media button and upload an image\n  console.log('Step 11: Uploading image...');\n  // Using a test image from the screenshots folder if available\n  const testImagePath = path.join(__dirname, '../tests/screenshots/test-image.png');\n  try {\n    await blogPostHelper.uploadBlogPostImage(page, testImagePath);\n    console.log('✓ Image uploaded and displayed');\n  } catch (e) {\n    console.log('⚠ Image upload skipped (test image not found)');\n  }\n  \n  // Step 12: Enter body content using the rich text editor\n  console.log('Step 12: Entering blog post body content...');\n  await blogPostHelper.fillBlogPostBody(page, blogPostBody);\n  console.log('✓ Body content saved with formatting');\n  \n  // Step 13: Click Save & Close button\n  console.log('Step 13: Saving blog post...');\n  await blogPostHelper.saveBlogPost(page);\n  console.log('✓ Clicking Save & Close');\n  \n  // Verify: Blog post is created successfully and user is redirected to the content view\n  console.log('Verifying blog post creation...');\n  await blogPostHelper.verifyBlogPostCreated(page);\n  console.log('✓ Blog post created successfully and user redirected to content view');\n  \n  // Final assertion\n  await expect(page).not.toHaveURL(/.*add.*|.*create.*/i);\n  console.log('\\n✅ Test TC-1455 completed successfully!');\n});\n"
    helperContent: "// tests/helpers/authHelper.js\nconst { expect } = require('@playwright/test');\n\n// Legacy login helper: logs in and, if the anti-bot math challenge appears, tries to\n// detect the answer input heuristically (by scanning visible text inputs) and solve it.\n// Superseded by login() below, which targets the math input directly by role/name —\n// kept only for any older specs still calling it.\nasync function loginWithMathChallenge(page, username, password) {\n  // Navigate to login page\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  console.log('✓ Navigated to login page');\n  \n  // Enter username\n  const usernameField = page.getByLabel('Username').first();\n  await usernameField.fill(username);\n  console.log('✓ Username entered');\n  \n  // Enter password\n  const passwordField = page.getByLabel('Password').first();\n  await passwordField.fill(password);\n  console.log('✓ Password entered');\n  \n  // Click login button - this will show the math challenge\n  const loginButton = page.getByRole('button', { name: /log in/i }).first();\n  await loginButton.click();\n  console.log('✓ Login button clicked');\n  \n  // Wait for math challenge to appear on the page\n  await page.waitForTimeout(1500);\n  \n  // Look for the math question text\n  const mathQuestionElement = page.getByText(/Solve this simple math problem/i).first();\n  \n  if (await mathQuestionElement.count() > 0) {\n    console.log('✓ Math challenge section detected');\n    \n    // Find the math input field - it's typically near the math question\n    // Look for input fields and try to find the one for math answer\n    const allInputs = page.locator('input[type=\"text\"], input[type=\"number\"]');\n    const inputCount = await allInputs.count();\n    \n    console.log(`Found ${inputCount} input fields on page`);\n    \n    // The math answer input is usually the 3rd input after username and password\n    if (inputCount >= 3) {\n      const mathAnswerInput = allInputs.nth(2);\n      \n      // Get all visible inputs to determine which one is for math\n      let mathInputFound = false;\n      for (let i = 2; i < Math.min(5, inputCount); i++) {\n        const input = allInputs.nth(i);\n        try {\n          const isVisible = await input.isVisible();\n          if (isVisible) {\n            // Get the aria-label or placeholder to check if it's a math input\n            const ariaLabel = await input.getAttribute('aria-label');\n            const placeholder = await input.getAttribute('placeholder');\n            const name = await input.getAttribute('name');\n            \n            console.log(`Input ${i}: aria-label=${ariaLabel}, placeholder=${placeholder}, name=${name}`);\n            \n            // Try to fill this input\n            // First extract the math question from page\n            const bodyText = await page.locator('body').textContent();\n            const mathMatch = bodyText.match(/Solve this simple math problem.*?(\\d+)\\s*([\\+\\-\\*\\/])\\s*(\\d+)/i);\n            \n            if (mathMatch) {\n              const [, num1, operator, num2] = mathMatch;\n              let answer;\n              \n              switch (operator.trim()) {\n                case '+':\n                  answer = parseInt(num1) + parseInt(num2);\n                  break;\n                case '-':\n                  answer = parseInt(num1) - parseInt(num2);\n                  break;\n                case '*':\n                  answer = parseInt(num1) * parseInt(num2);\n                  break;\n                case '/':\n                  answer = Math.floor(parseInt(num1) / parseInt(num2));\n                  break;\n                default:\n                  answer = 0;\n              }\n              \n              console.log(`✓ Math problem: ${num1} ${operator.trim()} ${num2} = ${answer}`);\n              \n              await input.focus();\n              await input.fill(String(answer));\n              await page.waitForTimeout(300);\n              \n              const filledValue = await input.inputValue();\n              if (filledValue === String(answer)) {\n                console.log(`✓ Math answer ${answer} successfully entered`);\n                mathInputFound = true;\n                break;\n              }\n            }\n          }\n        } catch (e) {\n          // Continue to next input\n        }\n      }\n      \n      if (!mathInputFound) {\n        console.log('⚠ Could not determine which input is for math answer');\n      }\n    }\n  }\n  \n  // Click login button again to submit with math answer\n  await loginButton.click();\n  console.log('✓ Login submitted with math answer');\n  \n  // Wait for redirect after successful login\n  try {\n    await page.waitForURL(url => !url.includes('/user/login'), { timeout: 5000 });\n    console.log('✓ Successfully logged in and redirected');\n  } catch (e) {\n    console.log('⚠ Login may have failed or no redirect occurred');\n    // Check if we're still on the login page\n    const currentUrl = page.url();\n    if (currentUrl.includes('/user/login')) {\n      throw new Error('Login failed - still on login page after submitting credentials');\n    }\n  }\n}\n\n// Standard login helper for valid credentials: fills the form, submits, answers the\n// anti-bot math challenge if it appears (retrying up to 5 times), and asserts the\n// login succeeded (navigated away from /user/login). Use this for any flow that\n// needs a real, logged-in session.\nasync function login(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  // The anti-bot math challenge appears after a submit and clears the password field, so the\n  // password has to be re-entered alongside the answer. It can reappear with a new question on\n  // consecutive submits, so keep answering it until it clears or we give up retrying.\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n\n  await expect(page).not.toHaveURL(/\\/user\\/login/);\n}\n\n// Login helper for credentials expected to FAIL (e.g. wrong password, fake account).\n// Same anti-bot retry pattern as login(), but does not assert success — the caller\n// asserts on whatever error state results instead.\nasync function attemptInvalidLogin(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n}\n\n// Logs out by navigating directly to the logout URL (Drupal ends the session on GET).\nasync function logout(page) {\n  await page.goto('https://test.registertovote.london/user/logout', { waitUntil: 'domcontentloaded' });\n}\n\n// From an already-logged-in page, navigates through \"Add content\" > \"News article /\n// Blog post\" to reach the blog creation form. Tries several selector fallbacks at each\n// step since the exact link/button markup isn't guaranteed.\nasync function navigateToBlogCreation(page) {\n  // Wait for page to stabilize\n  await page.waitForTimeout(1000);\n  \n  // Look for \"Add content\" menu item or button - check both links and buttons\n  const addContentLocators = [\n    page.getByRole('link', { name: 'Add content' }),\n    page.getByRole('button', { name: 'Add content' }),\n    page.locator('a[href*=\"/node/add\"]'), // no accessible name to match on; href is the only signal\n    page.getByRole('link', { name: 'Add' }),\n  ];\n\n  let addContentClicked = false;\n  for (const locator of addContentLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"Add content\"');\n      addContentClicked = true;\n      await page.waitForTimeout(500);\n      break;\n    }\n  }\n  \n  if (!addContentClicked) {\n    throw new Error('Could not find \"Add content\" button/link');\n  }\n  \n  // Click on \"News article / Blog post\" option\n  const blogPostLocators = [\n    page.getByRole('link', { name: 'News article' }),\n    page.getByRole('link', { name: 'Blog post' }),\n    page.getByRole('link', { name: /News article.*Blog post|Blog post.*News/ }),\n    page.locator('li').filter({ hasText: /News article.*Blog post|Blog post/ }), // no interactive role on a bare <li>\n  ];\n\n  let found = false;\n  for (const locator of blogPostLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"News article / Blog post\"');\n      found = true;\n      break;\n    }\n  }\n  \n  if (!found) {\n    throw new Error('Could not find \"News article / Blog post\" option');\n  }\n  \n  // Wait for blog creation form to load\n  await page.waitForSelector('form, input[type=\"text\"]', { timeout: 5000 });\n  console.log('✓ Blog creation form loaded');\n}\n\n// loginWithMathChallenge: legacy, heuristic-based login (see comment above it)\n// login: standard login for valid credentials, asserts success\n// attemptInvalidLogin: login for credentials expected to fail, no success assertion\n// logout: ends the session\n// navigateToBlogCreation: from a logged-in page, reaches the blog creation form\nmodule.exports = {\n  loginWithMathChallenge,\n  login,\n  attemptInvalidLogin,\n  logout,\n  navigateToBlogCreation,\n};\n\n// tests/helpers/blogPostHelper.js\nconst { expect } = require('@playwright/test');\n\nasync function fillBlogPostTitle(page, title) {\n  const titleField = page.getByLabel(/title/i)\n    .or(page.locator('input[name*=\"title\"]'))\n    .first();\n  \n  await titleField.fill(title);\n  await expect(titleField).toHaveValue(title);\n}\n\nasync function fillBlogPostSummary(page, summary) {\n  const summaryField = page.getByLabel(/summary/i)\n    .or(page.locator('textarea[name*=\"summary\"]'))\n    .first();\n  \n  await summaryField.fill(summary);\n  await expect(summaryField).toHaveValue(summary);\n}\n\nasync function uploadBlogPostImage(page, imagePath) {\n  const addMediaButton = page.getByRole('button', { name: /add media|upload/i }).first();\n  \n  if (await addMediaButton.count() > 0) {\n    await addMediaButton.click();\n  }\n  \n  // Wait for file input or upload dialog\n  await page.waitForTimeout(1000);\n  \n  // Find file input and upload\n  const fileInput = page.locator('input[type=\"file\"]').first();\n  if (await fileInput.count() > 0) {\n    await fileInput.setInputFiles(imagePath);\n    \n    // Wait for image to upload\n    await page.waitForTimeout(2000);\n  }\n}\n\nasync function fillBlogPostBody(page, bodyContent) {\n  // Try to find rich text editor (CKEditor, TinyMCE, etc.)\n  const richTextEditors = [\n    page.locator('.ck-editor__editable'),  // CKEditor\n    page.locator('.tox-editarea'),          // TinyMCE\n    page.getByLabel(/body|content/i),       // Generic label\n    page.locator('textarea[name*=\"body\"]'), // Textarea\n    page.locator('div[contenteditable=\"true\"]'), // Contenteditable div\n  ];\n  \n  for (const editor of richTextEditors) {\n    if (await editor.count() > 0) {\n      await editor.click();\n      await editor.fill(bodyContent);\n      await expect(editor).toContainText(bodyContent);\n      return;\n    }\n  }\n  \n  throw new Error('Could not find blog post body editor');\n}\n\nasync function saveBlogPost(page) {\n  const saveButton = page.getByRole('button', { name: /save.*close|save.*publish|save/i }).first();\n  \n  if (await saveButton.count() === 0) {\n    throw new Error('Save button not found');\n  }\n  \n  await saveButton.click();\n  \n  // Wait for redirect or success message\n  await page.waitForNavigation({ timeout: 10000 }).catch(() => {\n    // Navigation might not happen, check for success message instead\n  });\n}\n\nasync function verifyBlogPostCreated(page) {\n  // Check for success message or redirect to content view\n  const successMessage = page.getByText(/success|created|published|blog.*created/i).first();\n  \n  if (await successMessage.count() > 0) {\n    await expect(successMessage).toBeVisible();\n    return true;\n  }\n  \n  // Or check if we're on a content view page (not the form)\n  const currentUrl = page.url();\n  if (!currentUrl.includes('/add') && !currentUrl.includes('/create')) {\n    return true;\n  }\n  \n  throw new Error('Could not verify blog post was created');\n}\n\nmodule.exports = {\n  fillBlogPostTitle,\n  fillBlogPostSummary,\n  uploadBlogPostImage,\n  fillBlogPostBody,\n  saveBlogPost,\n  verifyBlogPostCreated,\n};\n"
