- description: forgot-password-reset-with-invalid-email-address.spec.js
  vars:
    testCaseId: '1571004'
    testCaseTitle: Forgot password reset with invalid email address
    steps: |
      1. Navigate to https://test.registertovote.london/user/password
         Expected: 'Reset your password' heading is visible; 'Username or email address' field, the 'Password reset instructions will be sent to your registered email address.' text, and a Submit button are all visible
      2. Enter the fake email wearetesting@test.com and click Submit; solve the resulting anti-bot math challenge and submit again
         Expected: Browser lands on the homepage (not /user/password); a status message reads 'If wearetesting@test.com is a valid account, an email will be sent with instructions to reset your password.'
    scriptContent: |
      // spec: specs/tc-1571004-forgot-password-plan.md
      // seed: tests/seed.spec.ts

      const { test } = require('@playwright/test');
      const {
        PASSWORD_RESET_URL,
        expectResetFormVisible,
        submitPasswordReset,
        expectResetConfirmation,
      } = require('../helpers/passwordResetHelper');

      const FAKE_EMAIL = 'wearetesting@test.com';

      test.describe('Password Reset', () => {
        test('Forgot password reset with invalid email address', async ({ page }) => {
          // 1-3. Navigate to the password reset page and verify the form
          await page.goto(PASSWORD_RESET_URL);
          await expectResetFormVisible(page);

          // 4-5. Submit a fake email, solve the anti-bot challenge, confirm the message
          await submitPasswordReset(page, FAKE_EMAIL);
          await expectResetConfirmation(page, FAKE_EMAIL);
        });
      });
    helperContent: |
      // tests/helpers/passwordResetHelper.js
      const { expect } = require('@playwright/test');

      const PASSWORD_RESET_URL = 'https://test.registertovote.london/user/password';
      const HOME_URL = 'https://test.registertovote.london/';

      async function expectResetFormVisible(page) {
        await expect(page.getByRole('heading', { name: 'Reset your password' })).toBeVisible();
        await expect(page.getByRole('textbox', { name: 'Username or email address' })).toBeVisible();
        await expect(page.getByText('Password reset instructions will be sent to your registered email address.')).toBeVisible();
        await expect(page.getByRole('button', { name: 'Submit' })).toBeVisible();
      }

      // Submits an email through the password-reset form, answering the anti-bot math
      // challenge if it appears (same retry pattern as authHelper's login helpers).
      async function submitPasswordReset(page, email) {
        await page.getByRole('textbox', { name: 'Username or email address' }).fill(email);
        await page.getByRole('button', { name: 'Submit' }).click();

        const mathQuestion = page.getByText(/Math question \((\d+)\s*([+\-*/])\s*(\d+)\s*=\)/);
        for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {
          const [, a, operator, b] = (await mathQuestion.textContent()).match(/\((\d+)\s*([+\-*/])\s*(\d+)\s*=\)/);
          const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](
            Number(a),
            Number(b)
          );

          await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));
          await page.getByRole('button', { name: 'Submit' }).click();
        }
      }

      async function expectResetConfirmation(page, email) {
        await expect(page).toHaveURL(HOME_URL);
        await expect(page.getByRole('heading', { name: 'Status message' })).toBeVisible();
        await expect(
          page.getByText(`If ${email} is a valid account, an email will be sent with instructions to reset your password.`)
        ).toBeVisible();
      }

      module.exports = {
        PASSWORD_RESET_URL,
        expectResetFormVisible,
        submitPasswordReset,
        expectResetConfirmation,
      };
