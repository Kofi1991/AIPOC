- description: verify-expandable-accordion-functionality-for-voting-steps.spec.js
  vars:
    testCaseId: '1601825'
    testCaseTitle: Verify expandable accordion functionality for voting steps
    steps: |
      1. Navigate to https://test.registertovote.london/ and locate the 'Voting in 3 steps' section
         Expected: Section heading 'Voting in 3 steps' is visible with three step buttons: 'Step 1 Register', 'Step 2 Voter ID', 'Step 3 Vote'; all three steps start collapsed (no aria-expanded=true, no content region visible)
      2. Click the 'Step 2 Voter ID' button to expand it
         Expected: Button now has aria-expanded=true; a content region with real Voter ID copy becomes visible directly after the button
      3. Click the 'Step 3 Vote' button to expand it while Step 2 is still expanded
         Expected: Step 3 expands (aria-expanded=true, its own content region becomes visible); Step 2 remains expanded and unaffected
      4. Click the still-expanded 'Step 2 Voter ID' button again (the same button, not a separate collapse control)
         Expected: Step 2 collapses (aria-expanded no longer true, content region no longer visible); Step 3 remains expanded and unaffected
    scriptContent: |
      // spec: specs/tc-1601825-voting-steps-accordion-plan.md
      // seed: tests/seed.spec.ts

      const { test } = require('@playwright/test');
      const {
        HOME_URL,
        expectAccordionLoaded,
        expandStep,
        collapseStep,
        expectStepExpanded,
      } = require('../helpers/homeAccordionHelper');

      test.describe('Homepage', () => {
        test('Verify expandable accordion functionality for voting steps', async ({ page }) => {
          // 1. Navigate to the homepage and locate the 'Voting in 3 steps' section
          await page.goto(HOME_URL);
          await expectAccordionLoaded(page);

          // 2. Click Step 2 'Voter ID' to expand it
          await expandStep(page, 'Step 2 Voter ID');

          // 3. Click Step 3 'Vote' to expand it while Step 2 is still expanded
          await expandStep(page, 'Step 3 Vote');
          await expectStepExpanded(page, 'Step 2 Voter ID');

          // 4. Click the still-expanded Step 2 button again to collapse it
          await collapseStep(page, 'Step 2 Voter ID');
          await expectStepExpanded(page, 'Step 3 Vote');
        });
      });
    helperContent: |
      // tests/helpers/homeAccordionHelper.js
      const { expect } = require('@playwright/test');

      const HOME_URL = 'https://test.registertovote.london/';
      const STEP_NAMES = ['Step 1 Register', 'Step 2 Voter ID', 'Step 3 Vote'];

      // A snippet of each step's real content, used to confirm the accordion panel
      // actually renders — not just that aria-expanded flipped.
      const STEP_CONTENT_SNIPPET = {
        'Step 2 Voter ID': 'Voters in England, and thus',
        'Step 3 Vote': 'You can vote:',
      };

      function stepButton(page, stepName) {
        return page.getByRole('button', { name: stepName });
      }

      async function expectStepCollapsed(page, stepName) {
        await expect(stepButton(page, stepName)).not.toHaveAttribute('aria-expanded', 'true');
      }

      async function expectStepExpanded(page, stepName) {
        await expect(stepButton(page, stepName)).toHaveAttribute('aria-expanded', 'true');
      }

      // Expand and collapse share the same button — there is no separate collapse control.
      async function toggleStep(page, stepName) {
        await stepButton(page, stepName).click();
      }

      // Verifies the section and all three step buttons are visible and start collapsed.
      async function expectAccordionLoaded(page) {
        await expect(page.getByRole('heading', { name: 'Voting in 3 steps' })).toBeVisible();
        for (const stepName of STEP_NAMES) {
          await expect(stepButton(page, stepName)).toBeVisible();
          await expectStepCollapsed(page, stepName);
        }
      }

      // Toggles a step open and confirms both the expanded state and its real content.
      // A page reflow from a neighboring step's expand animation can occasionally
      // swallow the click, so the click+verify is retried as a unit rather than once.
      async function expandStep(page, stepName) {
        await expect(async () => {
          await toggleStep(page, stepName);
          await expectStepExpanded(page, stepName);
        }).toPass({ timeout: 15000 });
        const snippet = STEP_CONTENT_SNIPPET[stepName];
        if (snippet) {
          await expect(page.getByText(snippet)).toBeVisible();
        }
      }

      // Toggles an expanded step closed and confirms it collapsed. Same retry rationale as expandStep.
      async function collapseStep(page, stepName) {
        await expect(async () => {
          await toggleStep(page, stepName);
          await expectStepCollapsed(page, stepName);
        }).toPass({ timeout: 15000 });
      }

      module.exports = {
        HOME_URL,
        expectAccordionLoaded,
        expandStep,
        collapseStep,
        expectStepExpanded,
      };
  assert:
  - type: llm-rubric
    value: |-
      The output should be a Playwright test script (JavaScript) that automates TestCollab case TC-1601825 ("Verify expandable accordion functionality for voting steps"). It should:
      - Cover every numbered step above and assert its "Expected" outcome using Playwright's expect().
      - Prefer accessible locators (getByRole, getByLabel, getByText) over raw CSS or XPath selectors.
      - Not hardcode any credentials or secrets as literal strings; read them from environment variables if login is required.
