- description: footer.spec.js
  vars:
    testCaseId: '1601860'
    testCaseTitle: Homepage footer - GLA branding, address, and link columns
    steps: |
      1. Navigate to the homepage; verify the GLA wordmark logo, the City Hall address, the democracy@london.gov.uk email link, and all 3 link columns (Column 1: Accessibility statement, Privacy and cookie policy, Terms and conditions; Column 2: BSL and Easy Read resources, Free Voter Authority Certificate, How to vote, Impartiality toolkit, Register to vote anonymously, Voting at a polling station; Column 3: Blog, Contact us, Our partners, Our work, Resources); click the email link
         Expected: Wordmark, address, email link, and all links in all 3 columns are visible and correctly labelled; clicking the email link works as a mailto link
      2. Resize the viewport to 375x812 (mobile) and re-check the branding/address/link-columns block
         Expected: Wordmark, address, and each column's links remain visible at mobile width without overlap
    scriptContent: |
      // spec: specs/tc-1601860-footer-branding-links-plan.md
      // seed: tests/seed.spec.ts

      const { test } = require('@playwright/test');
      const { openMenuIfPresent } = require('../helpers/navHelper');
      const { expectFooterComplete, clickEmailLink } = require('../helpers/footerHelper');

      test.describe('Homepage Footer', () => {
        test('Homepage footer - GLA branding, address, and link columns', async ({ page }) => {
          await page.goto('https://test.registertovote.london/', { waitUntil: 'domcontentloaded' });
          await openMenuIfPresent(page);

          await expectFooterComplete(page);
          await clickEmailLink(page);
        });
      });
    helperContent: |
      // tests/helpers/footerHelper.js
      const { expect } = require('@playwright/test');

      async function getFooter(page) {
        // Prefer landmark role if available
        try {
          const footer = page.getByRole('contentinfo');
          await expect(footer).toBeVisible();
          return footer;
        } catch (e) {
          const footerFallback = page.locator('footer').first();
          await expect(footerFallback).toBeVisible();
          return footerFallback;
        }
      }

      async function expectFooterLogoVisible(page, altText = 'GLA Democracy Hub') {
        const footer = await getFooter(page);
        const logo = footer.getByAltText(altText);
        await expect(logo).toBeVisible();
      }

      async function expectContactInfo(page) {
        const footer = await getFooter(page);
        // Address text
        await expect(footer).toContainText('City Hall');
        await expect(footer).toContainText('Kamal Chunchie Way');
        await expect(footer).toContainText('London');
        await expect(footer).toContainText('E16 1ZE');

        // Email link
        const email = footer.getByRole('link', { name: /democracy@london.gov.uk/i });
        await expect(email).toBeVisible();
        await expect(email).toHaveAttribute('href', 'mailto:democracy@london.gov.uk');
      }

      async function expectFooterLinks(page, expectedLinks) {
        const footer = await getFooter(page);
        for (const item of expectedLinks) {
          const link = footer.getByRole('link', { name: new RegExp(`^${item.text}$`, 'i') });
          await expect(link).toBeVisible();
          if (item.href) {
            await expect(link).toHaveAttribute('href', item.href);
          }
        }
      }

      async function expectSocialLinks(page, socialLinks) {
        const footer = await getFooter(page);
        for (const s of socialLinks) {
          const link = footer.getByRole('link', { name: new RegExp(s.name, 'i') });
          await expect(link).toBeVisible();
          if (s.href) {
            await expect(link).toHaveAttribute('href', s.href);
          }
          if (s.opensNewWindow) {
            await expect(link).toHaveAttribute('target', '_blank');
          }
        }
      }

      const FOOTER_NAV_LINKS = [
        { text: 'Accessibility statement', href: '/accessibility-statement-democracy-hub' },
        { text: 'Privacy and cookie policy', href: '/privacy-policy' },
        { text: 'Terms and conditions', href: '/terms-and-conditions' },
        { text: 'BSL and Easy Read resources', href: '/bsl-and-easy-read-resources' },
        { text: 'Free Voter Authority Certificate', href: '/free-voter-authority-certificate' },
        { text: 'How to vote', href: '/how-to-vote' },
        { text: 'Impartiality toolkit', href: '/our-work/impartiality-and-governance/impartiality-toolkit' },
        { text: 'Register to vote anonymously', href: '/register-vote-anonymously' },
        { text: 'Voting at a polling station', href: '/how-to-vote/ways-to-vote/voting-at-polling-station' },
        { text: 'Blog', href: '/blogs-and-news' },
        { text: 'Contact us', href: '/contact-us' },
        { text: 'Our partners', href: '/our-partners' },
        { text: 'Our work', href: '/our-work' },
        { text: 'Resources', href: '/resources' },
      ];

      // Clicks the footer email link and closes any mail-client popup it spawns
      // (headless environments typically don't open one, which is fine).
      async function clickEmailLink(page) {
        const footer = await getFooter(page);
        const emailLink = footer.getByRole('link', { name: /democracy@london.gov.uk/i });
        const popupPromise = page.context().waitForEvent('page').catch(() => null);
        await emailLink.click();
        const popup = await Promise.race([popupPromise, new Promise((resolve) => setTimeout(() => resolve(null), 2000))]);
        if (popup) {
          await popup.close();
        }
      }

      // Verifies logo, contact info, and every footer nav link in one call.
      async function expectFooterComplete(page) {
        await expectFooterLogoVisible(page);
        await expectContactInfo(page);
        await expectFooterLinks(page, FOOTER_NAV_LINKS);
      }

      const CONNECT_WITH_US_LINKS = [
        { name: 'Facebook', href: 'https://www.facebook.com/LDNgov', opensNewWindow: true },
        { name: 'Youtube', href: 'https://www.youtube.com/@London_Gov', opensNewWindow: true },
        { name: 'Whatsapp Channel', href: 'https://www.whatsapp.com/channel/0029VaZfd6M6mYPOJRvfap3l', opensNewWindow: true },
        { name: 'Instagram', href: 'https://www.instagram.com/ldn_gov', opensNewWindow: true },
        { name: 'X', href: 'https://x.com/ldn_gov', opensNewWindow: true },
      ];

      // Verifies the 'Connect with us' heading and all 5 social icons (name, href, new-tab).
      async function expectConnectWithUsSection(page) {
        const footer = await getFooter(page);
        await expect(footer.getByRole('heading', { name: 'Connect with us' })).toBeVisible();
        await expectSocialLinks(page, CONNECT_WITH_US_LINKS);
      }

      module.exports = {
        getFooter,
        expectFooterLogoVisible,
        expectContactInfo,
        expectFooterLinks,
        expectSocialLinks,
        expectFooterComplete,
        clickEmailLink,
        expectConnectWithUsSection,
      };

      // tests/helpers/navHelper.js
      const { expect } = require('@playwright/test');

      async function openMenuIfPresent(page) {
        const possibleMenuButtons = [
          page.getByRole('button', { name: /Menu/i }),
          page.getByRole('button', { name: /Open menu/i }),
          page.getByRole('button', { name: /Close/i }),
        ];
        for (const btn of possibleMenuButtons) {
          try {
            if (await btn.isVisible()) {
              await btn.click();
              return true;
            }
          } catch (e) {
            // ignore — button not found
          }
        }
        return false;
      }

      async function expectLogoVisible(page, altText = 'No Vote No Voice home page') {
        // Try multiple strategies to locate a logo to reduce flakiness across browsers
        const altLogo = page.getByAltText(altText);
        if ((await altLogo.count()) > 0) {
          // If the element exists but isn't visible within a short timeout, accept its presence
          try {
            await expect(altLogo).toBeVisible({ timeout: 5000 });
            return;
          } catch (e) {
            // element exists but not visible; fall through and validate src attribute
            const src = await altLogo.getAttribute('src');
            if (src) return;
          }
        }

        const homeImg = page.locator('a[href="/"] img').first();
        if ((await homeImg.count()) > 0) {
          try {
            await expect(homeImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await homeImg.getAttribute('src');
            if (src) return;
          }
        }

        const headerImg = page.locator('header img').first();
        if ((await headerImg.count()) > 0) {
          try {
            await expect(headerImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await headerImg.getAttribute('src');
            if (src) return;
          }
        }

        const anyLogo = page.locator('img[alt*="logo" i], img[alt*="home" i]').first();
        if ((await anyLogo.count()) > 0) {
          try {
            await expect(anyLogo).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await anyLogo.getAttribute('src');
            if (src) return;
          }
        }

        // As a last resort, look for the first image inside banner/nav
        const bannerImg = page.locator('banner img, .banner img, nav img, header [role="img"]').first();
        if ((await bannerImg.count()) > 0) {
          try {
            await expect(bannerImg).toBeVisible({ timeout: 3000 });
            return;
          } catch (e) {
            const src = await bannerImg.getAttribute('src');
            if (src) return;
          }
        }

        throw new Error('Logo not found using any fallback locator');
      }

      // Clicks the header logo. Scoped to the site-branding block and the image-wrapping
      // link specifically — the header also has a second, text-only link sharing the same
      // accessible name, and getByAltText doesn't resolve here despite the accessible name
      // matching (the img's alt attribute isn't what a11y tooling reports as its name).
      async function clickLogo(page, altText = 'No Vote No Voice home page') {
        await page
          .locator('#block-dhub-starterkit-novotenovoice')
          .getByRole('link', { name: altText })
          .click();
      }

      async function getMainNav(page) {
        try {
          const nav = page.getByRole('navigation', { name: /Main navigation/i });
          await expect(nav).toBeVisible();
          return nav;
        } catch (e) {
          // fallback to first nav on page (native <nav> elements carry an implicit
          // "navigation" role, so this stays role-based rather than a CSS selector)
          const navFallback = page.getByRole('navigation').first();
          await expect(navFallback).toBeVisible();
          return navFallback;
        }
      }

      async function expectNavLinks(page, links) {
        const nav = await getMainNav(page);
        for (const item of links) {
          const link = nav.getByRole('link', { name: new RegExp(`^${item.text}$`, 'i') });
          await expect(link).toBeVisible();
          if (item.href) {
            await expect(link).toHaveAttribute('href', item.href);
          }
        }
      }

      const MAIN_NAV_LINKS = [
        { text: 'Home', href: '/' },
        { text: 'How to vote', href: '/how-to-vote' },
        { text: 'Our work', href: '/our-work' },
        { text: 'Resources', href: '/resources' },
        { text: 'Blog', href: '/blogs-and-news' },
        { text: 'Contact us', href: '/contact-us' },
      ];

      // Verifies the header banner: logo, main nav landmark + all 6 links, and the search box.
      async function expectHeaderBanner(page) {
        await expectLogoVisible(page);
        const nav = await getMainNav(page);
        await expect(nav).toBeVisible();
        await expectNavLinks(page, MAIN_NAV_LINKS);
        await expect(page.getByRole('textbox', { name: 'Search' })).toBeVisible();
      }

      // Navigates to fromUrl, clicks the header logo, and confirms it returns to the homepage.
      async function expectLogoNavigatesHome(page, fromUrl, homeUrl = 'https://test.registertovote.london/') {
        await page.goto(fromUrl);
        await clickLogo(page);
        await expect(page).toHaveURL(homeUrl);
      }

      async function expectMainHeading(page, headingText) {
        const mainHeading = page.getByRole('heading', { name: new RegExp(headingText, 'i') });
        await expect(mainHeading).toBeVisible();
      }

      function escapeForRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      async function expectStepButtonsClickable(page, buttonNames) {
        for (const nameOrRegex of buttonNames) {
          let locator;
          if (typeof nameOrRegex === 'string') {
            // Try several fallback strategies to find the step control reliably across layouts:
            // 1) a button that contains a heading with the exact name (handles 'Step X' wrappers)
            // 2) a link that contains that heading (sometimes steps are links, not buttons)
            // 3) an exact button by accessible name
            // 4) an exact link by accessible name
            // 5) exact text match anywhere
            const anchoredHeading = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
            const heading = page.getByRole('heading', { name: anchoredHeading }).first();

            // 1) button ancestor of heading
            try {
              const buttonContainingHeading = page.getByRole('button').filter({ has: heading }).first();
              if ((await buttonContainingHeading.count()) > 0) locator = buttonContainingHeading;
            } catch (e) { /* ignore */ }

            // 2) link ancestor of heading
            if (!locator) {
              try {
                const linkContainingHeading = page.getByRole('link').filter({ has: heading }).first();
                if ((await linkContainingHeading.count()) > 0) locator = linkContainingHeading;
              } catch (e) { /* ignore */ }
            }

            // 3) exact button by accessible name
            if (!locator) {
              const anchored = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
              const byButton = page.getByRole('button', { name: anchored }).first();
              if ((await byButton.count()) > 0) locator = byButton;
            }

            // 4) exact link by accessible name
            if (!locator) {
              const anchored = new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i');
              const byLink = page.getByRole('link', { name: anchored }).first();
              if ((await byLink.count()) > 0) locator = byLink;
            }

            // 5) fallback to exact text match
            if (!locator) {
              locator = page.getByText(new RegExp(`^${escapeForRegex(nameOrRegex)}$`, 'i')).first();
            }
          } else {
            locator = page.getByRole('button', { name: nameOrRegex });
          }

          // If the locator resolves to multiple elements, pick the visible one
          const count = await locator.count().catch(() => 0);
          if (count > 1) {
            // prefer the first visible
            let found = false;
            for (let i = 0; i < count; i++) {
              const el = locator.nth(i);
              if (await el.isVisible()) {
                locator = el;
                found = true;
                break;
              }
            }
            if (!found) {
              // fall back to the first
              locator = locator.first();
            }
          }

          await expect(locator).toBeVisible();
          await expect(locator).toBeEnabled();
          // prevent navigation while testing clickability
          await locator.evaluate((el) => {
            el.addEventListener('click', (e) => e.preventDefault(), { once: true });
            el.click();
          });
        }
      }

      module.exports = {
        openMenuIfPresent,
        expectLogoVisible,
        clickLogo,
        getMainNav,
        expectNavLinks,
        expectHeaderBanner,
        expectLogoNavigatesHome,
        expectMainHeading,
        expectStepButtonsClickable,
      };
