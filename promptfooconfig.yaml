# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide
description: My eval
prompts:
- |
  Write a Playwright test script (JavaScript, using @playwright/test) that automates the following TestCollab test case.

  Test case: {{testCaseTitle}} (TC-{{testCaseId}})

  Steps:
  {{steps}}

  The following helper module(s) already exist in this codebase and encode verified, live-tested facts about the real page (exact accessible names, real hrefs, field requirements, locator strategy for things like Choices.js listbox widgets, retry patterns for known-flaky interactions, etc.). Import and reuse them rather than reinventing locators from scratch, and do not contradict anything they establish:

  {{helperContent}}

  For additional reference, here is an existing script already implemented for this test case, showing the established structure and conventions used in this codebase (you do not need to match it verbatim, but should be at least as correct):

  {{scriptContent}}

  Follow these rules exactly:
  - Never hardcode credentials or secrets as literal strings anywhere in the file, including as arguments passed to a helper — read them from process.env directly (e.g. process.env.TC_USER), even if the reference script above hardcodes them.
  - Write an explicit `await expect(...)` assertion in the test body for every step's "Expected" outcome, UNLESS a single existing helper function already fully performs that action and its verification in one call (e.g. a retry-wrapped helper for a known-flaky interaction) — in that case, call that one helper as-is rather than duplicating its work or reaching into its internal building blocks to produce a redundant assertion of your own.
  - Never call a helper's lower-level internal pieces directly when a higher-level helper already wraps them for a documented reason (such as retrying a flaky click, or retrying a challenge that can reappear) — bypassing that wrapper reintroduces the exact flakiness it exists to prevent.
  - Never assert an intermediate page state (e.g. an error message appearing after just one of several submit attempts) unless that exact intermediate state is explicitly documented in the helper's comments or the reference script — if it isn't documented, only assert the final, verified outcome.
  - Only import and call functions that are actually present in `module.exports` at the bottom of a helper's source above — never assume or invent an export that isn't listed there.

  Write only the final Playwright test script as your output — no explanation, no markdown code fences, just the raw JavaScript file contents.
providers:
- id: anthropic:messages:claude-sonnet-5
  config:
    max_tokens: 8192
    thinking:
      type: disabled
tests:
- description: verify-homepage-footer-connect-with-us-social-media-links.spec.js
  vars:
    testCaseId: '1601858'
    testCaseTitle: Homepage footer - 'Connect with us' social media links
    steps: |
      1. Navigate to https://test.registertovote.london/ and scroll to the footer
         Expected: Footer is reached without layout breakage; the 'Connect with us' heading (h2) is visible above the icon row
      2. Inspect all 5 social icons (Facebook, YouTube, WhatsApp, Instagram, X), including a target=_blank check
         Expected: Each icon has a non-empty accessible name ending '(opens in a new window)', a real href to the org's actual profile, and target=_blank; all 5 render as equally active/styled
      3. Resize the viewport to 375x812 (mobile) and re-check the icon row
         Expected: Icon row remains visible and usable, does not overlap or get cut off, all 5 icons fit in one row at this width
    scriptContent: |
      // spec: specs/tc-1601858-footer-social-links-plan.md
      // seed: tests/seed.spec.ts
      // NOTE: excludes case step 12 (screenshot/baseline comparison) — no visual-regression
      // baseline exists in this repo, same as tc-1601826.

      const { test } = require('@playwright/test');
      const { expectConnectWithUsSection } = require('../helpers/footerHelper');

      test.describe('Homepage Footer', () => {
        test("Homepage footer - 'Connect with us' social media links", async ({ page }) => {
          // 1-2. Navigate to the homepage, scroll to footer, verify heading + all 5 social icons
          await page.goto('https://test.registertovote.london/');
          await expectConnectWithUsSection(page);
        });
      });
    helperContent: |
      // tests/helpers/footerHelper.js
      const { expect } = require('@playwright/test');

      async function getFooter(page) {
        // Prefer landmark role if available
        try {
          const footer = page.getByRole('contentinfo');
          await expect(footer).toBeVisible();
          return footer;
        } catch (e) {
          const footerFallback = page.locator('footer').first();
          await expect(footerFallback).toBeVisible();
          return footerFallback;
        }
      }

      async function expectFooterLogoVisible(page, altText = 'GLA Democracy Hub') {
        const footer = await getFooter(page);
        const logo = footer.getByAltText(altText);
        await expect(logo).toBeVisible();
      }

      async function expectContactInfo(page) {
        const footer = await getFooter(page);
        // Address text
        await expect(footer).toContainText('City Hall');
        await expect(footer).toContainText('Kamal Chunchie Way');
        await expect(footer).toContainText('London');
        await expect(footer).toContainText('E16 1ZE');

        // Email link
        const email = footer.getByRole('link', { name: /democracy@london.gov.uk/i });
        await expect(email).toBeVisible();
        await expect(email).toHaveAttribute('href', 'mailto:democracy@london.gov.uk');
      }

      async function expectFooterLinks(page, expectedLinks) {
        const footer = await getFooter(page);
        for (const item of expectedLinks) {
          const link = footer.getByRole('link', { name: new RegExp(`^${item.text}$`, 'i') });
          await expect(link).toBeVisible();
          if (item.href) {
            await expect(link).toHaveAttribute('href', item.href);
          }
        }
      }

      async function expectSocialLinks(page, socialLinks) {
        const footer = await getFooter(page);
        for (const s of socialLinks) {
          const link = footer.getByRole('link', { name: new RegExp(s.name, 'i') });
          await expect(link).toBeVisible();
          if (s.href) {
            await expect(link).toHaveAttribute('href', s.href);
          }
          if (s.opensNewWindow) {
            await expect(link).toHaveAttribute('target', '_blank');
          }
        }
      }

      const FOOTER_NAV_LINKS = [
        { text: 'Accessibility statement', href: '/accessibility-statement-democracy-hub' },
        { text: 'Privacy and cookie policy', href: '/privacy-policy' },
        { text: 'Terms and conditions', href: '/terms-and-conditions' },
        { text: 'BSL and Easy Read resources', href: '/bsl-and-easy-read-resources' },
        { text: 'Free Voter Authority Certificate', href: '/free-voter-authority-certificate' },
        { text: 'How to vote', href: '/how-to-vote' },
        { text: 'Impartiality toolkit', href: '/our-work/impartiality-and-governance/impartiality-toolkit' },
        { text: 'Register to vote anonymously', href: '/register-vote-anonymously' },
        { text: 'Voting at a polling station', href: '/how-to-vote/ways-to-vote/voting-at-polling-station' },
        { text: 'Blog', href: '/blogs-and-news' },
        { text: 'Contact us', href: '/contact-us' },
        { text: 'Our partners', href: '/our-partners' },
        { text: 'Our work', href: '/our-work' },
        { text: 'Resources', href: '/resources' },
      ];

      // Clicks the footer email link and closes any mail-client popup it spawns
      // (headless environments typically don't open one, which is fine).
      async function clickEmailLink(page) {
        const footer = await getFooter(page);
        const emailLink = footer.getByRole('link', { name: /democracy@london.gov.uk/i });
        const popupPromise = page.context().waitForEvent('page').catch(() => null);
        await emailLink.click();
        const popup = await Promise.race([popupPromise, new Promise((resolve) => setTimeout(() => resolve(null), 2000))]);
        if (popup) {
          await popup.close();
        }
      }

      // Verifies logo, contact info, and every footer nav link in one call.
      async function expectFooterComplete(page) {
        await expectFooterLogoVisible(page);
        await expectContactInfo(page);
        await expectFooterLinks(page, FOOTER_NAV_LINKS);
      }

      const CONNECT_WITH_US_LINKS = [
        { name: 'Facebook', href: 'https://www.facebook.com/LDNgov', opensNewWindow: true },
        { name: 'Youtube', href: 'https://www.youtube.com/@London_Gov', opensNewWindow: true },
        { name: 'Whatsapp Channel', href: 'https://www.whatsapp.com/channel/0029VaZfd6M6mYPOJRvfap3l', opensNewWindow: true },
        { name: 'Instagram', href: 'https://www.instagram.com/ldn_gov', opensNewWindow: true },
        { name: 'X', href: 'https://x.com/ldn_gov', opensNewWindow: true },
      ];

      // Verifies the 'Connect with us' heading and all 5 social icons (name, href, new-tab).
      async function expectConnectWithUsSection(page) {
        const footer = await getFooter(page);
        await expect(footer.getByRole('heading', { name: 'Connect with us' })).toBeVisible();
        await expectSocialLinks(page, CONNECT_WITH_US_LINKS);
      }

      module.exports = {
        getFooter,
        expectFooterLogoVisible,
        expectContactInfo,
        expectFooterLinks,
        expectSocialLinks,
        expectFooterComplete,
        clickEmailLink,
        expectConnectWithUsSection,
      };
  assert:
  - type: llm-rubric
    value: |-
      The output should be a Playwright test script (JavaScript) that automates TestCollab case TC-1601858 ("Homepage footer - 'Connect with us' social media links"). It should:
      - Cover every numbered step above and assert its "Expected" outcome using Playwright's expect().
      - Prefer accessible locators (getByRole, getByLabel, getByText) over raw CSS or XPath selectors.
      - Not hardcode any credentials or secrets as literal strings; read them from environment variables if login is required.
      - Use awaited async Playwright APIs throughout (no dangling promises).

      For reference, here is the existing script already implemented in this repository for this test case. Use it, and the helper module(s) below that it imports, as additional context on established locator patterns, real page structure, and behavior already verified live in this codebase. The output does not need to match this reference verbatim, but should be at least as correct and should not contradict verified facts recorded in the helpers (e.g. real hrefs, accessible names, or field requirements):

      --- Existing script: verify-homepage-footer-connect-with-us-social-media-links.spec.js ---
      {{scriptContent}}

      --- Imported helper module(s) ---
      {{helperContent}}
- description: attempt-to-login-with-invalid-credentials.spec.js
  vars:
    testCaseId: '1578199'
    testCaseTitle: Attempt to login with invalid credentials
    steps: |
      1. Navigate to the login page and submit the fake account Access232@test.com / mimrad-0cidCy-kadhirreeeet
         Expected: First submission shows both 'Anti-bot verification failed.' and 'Unrecognized username or password.' together, plus a math-challenge widget
      2. Solve the math challenge and resubmit the same fake credentials
         Expected: Final error is exactly 'Unrecognized username or password.' with a working 'Forgot your password?' link to /user/password, no anti-bot text, no math challenge shown; URL remains on /user/login with no successful authentication
    scriptContent: |
      // spec: specs/tc-1578199-login-invalid-credentials-plan.md
      // seed: tests/seed.spec.ts

      const { test, expect } = require('@playwright/test');
      const { attemptInvalidLogin } = require('../helpers/authHelper');

      test.describe('Login', () => {
        test('Attempt to login with invalid credentials', async ({ page }) => {
          // 1-7. Submit a fake account; retries through the anti-bot math challenge internally
          await attemptInvalidLogin(page, 'Access232@test.com', 'mimrad-0cidCy-kadhirreeeet');

          await expect(page).toHaveURL(/\/user\/login/);
          await expect(page.getByText('Unrecognized username or password.')).toBeVisible();
          await expect(page.getByRole('link', { name: 'Forgot your password?' })).toHaveAttribute('href', '/user/password');
        });
      });
    helperContent: "// tests/helpers/authHelper.js\nconst { expect } = require('@playwright/test');\n\n// Legacy login helper: logs in and, if the anti-bot math challenge appears, tries to\n// detect the answer input heuristically (by scanning visible text inputs) and solve it.\n// Superseded by login() below, which targets the math input directly by role/name —\n// kept only for any older specs still calling it.\nasync function loginWithMathChallenge(page, username, password) {\n  // Navigate to login page\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  console.log('✓ Navigated to login page');\n  \n  // Enter username\n  const usernameField = page.getByLabel('Username').first();\n  await usernameField.fill(username);\n  console.log('✓ Username entered');\n  \n  // Enter password\n  const passwordField = page.getByLabel('Password').first();\n  await passwordField.fill(password);\n  console.log('✓ Password entered');\n  \n  // Click login button - this will show the math challenge\n  const loginButton = page.getByRole('button', { name: /log in/i }).first();\n  await loginButton.click();\n  console.log('✓ Login button clicked');\n  \n  // Wait for math challenge to appear on the page\n  await page.waitForTimeout(1500);\n  \n  // Look for the math question text\n  const mathQuestionElement = page.getByText(/Solve this simple math problem/i).first();\n  \n  if (await mathQuestionElement.count() > 0) {\n    console.log('✓ Math challenge section detected');\n    \n    // Find the math input field - it's typically near the math question\n    // Look for input fields and try to find the one for math answer\n    const allInputs = page.locator('input[type=\"text\"], input[type=\"number\"]');\n    const inputCount = await allInputs.count();\n    \n    console.log(`Found ${inputCount} input fields on page`);\n    \n    // The math answer input is usually the 3rd input after username and password\n    if (inputCount >= 3) {\n      const mathAnswerInput = allInputs.nth(2);\n      \n      // Get all visible inputs to determine which one is for math\n      let mathInputFound = false;\n      for (let i = 2; i < Math.min(5, inputCount); i++) {\n        const input = allInputs.nth(i);\n        try {\n          const isVisible = await input.isVisible();\n          if (isVisible) {\n            // Get the aria-label or placeholder to check if it's a math input\n            const ariaLabel = await input.getAttribute('aria-label');\n            const placeholder = await input.getAttribute('placeholder');\n            const name = await input.getAttribute('name');\n            \n            console.log(`Input ${i}: aria-label=${ariaLabel}, placeholder=${placeholder}, name=${name}`);\n            \n            // Try to fill this input\n            // First extract the math question from page\n            const bodyText = await page.locator('body').textContent();\n            const mathMatch = bodyText.match(/Solve this simple math problem.*?(\\d+)\\s*([\\+\\-\\*\\/])\\s*(\\d+)/i);\n            \n            if (mathMatch) {\n              const [, num1, operator, num2] = mathMatch;\n              let answer;\n              \n              switch (operator.trim()) {\n                case '+':\n                  answer = parseInt(num1) + parseInt(num2);\n                  break;\n                case '-':\n                  answer = parseInt(num1) - parseInt(num2);\n                  break;\n                case '*':\n                  answer = parseInt(num1) * parseInt(num2);\n                  break;\n                case '/':\n                  answer = Math.floor(parseInt(num1) / parseInt(num2));\n                  break;\n                default:\n                  answer = 0;\n              }\n              \n              console.log(`✓ Math problem: ${num1} ${operator.trim()} ${num2} = ${answer}`);\n              \n              await input.focus();\n              await input.fill(String(answer));\n              await page.waitForTimeout(300);\n              \n              const filledValue = await input.inputValue();\n              if (filledValue === String(answer)) {\n                console.log(`✓ Math answer ${answer} successfully entered`);\n                mathInputFound = true;\n                break;\n              }\n            }\n          }\n        } catch (e) {\n          // Continue to next input\n        }\n      }\n      \n      if (!mathInputFound) {\n        console.log('⚠ Could not determine which input is for math answer');\n      }\n    }\n  }\n  \n  // Click login button again to submit with math answer\n  await loginButton.click();\n  console.log('✓ Login submitted with math answer');\n  \n  // Wait for redirect after successful login\n  try {\n    await page.waitForURL(url => !url.includes('/user/login'), { timeout: 5000 });\n    console.log('✓ Successfully logged in and redirected');\n  } catch (e) {\n    console.log('⚠ Login may have failed or no redirect occurred');\n    // Check if we're still on the login page\n    const currentUrl = page.url();\n    if (currentUrl.includes('/user/login')) {\n      throw new Error('Login failed - still on login page after submitting credentials');\n    }\n  }\n}\n\n// Standard login helper for valid credentials: fills the form, submits, answers the\n// anti-bot math challenge if it appears (retrying up to 5 times), and asserts the\n// login succeeded (navigated away from /user/login). Use this for any flow that\n// needs a real, logged-in session.\nasync function login(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  // The anti-bot math challenge appears after a submit and clears the password field, so the\n  // password has to be re-entered alongside the answer. It can reappear with a new question on\n  // consecutive submits, so keep answering it until it clears or we give up retrying.\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n\n  await expect(page).not.toHaveURL(/\\/user\\/login/);\n}\n\n// Login helper for credentials expected to FAIL (e.g. wrong password, fake account).\n// Same anti-bot retry pattern as login(), but does not assert success — the caller\n// asserts on whatever error state results instead.\nasync function attemptInvalidLogin(page, username, password) {\n  await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });\n  await page.getByRole('textbox', { name: 'Username' }).fill(username);\n  await page.getByRole('textbox', { name: 'Password' }).fill(password);\n  await page.getByRole('button', { name: 'Log in' }).click();\n\n  const mathQuestion = page.getByText(/Math question \\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n  for (let attempt = 0; attempt < 5 && (await mathQuestion.isVisible().catch(() => false)); attempt++) {\n    const [, a, operator, b] = (await mathQuestion.textContent()).match(/\\((\\d+)\\s*([+\\-*/])\\s*(\\d+)\\s*=\\)/);\n    const answer = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y }[operator](\n      Number(a),\n      Number(b)\n    );\n\n    await page.getByRole('textbox', { name: 'Password' }).fill(password);\n    await page.getByRole('textbox', { name: /Math question/ }).fill(String(answer));\n    await page.getByRole('button', { name: 'Log in' }).click();\n  }\n}\n\n// Logs out by navigating directly to the logout URL (Drupal ends the session on GET).\nasync function logout(page) {\n  await page.goto('https://test.registertovote.london/user/logout', { waitUntil: 'domcontentloaded' });\n}\n\n// From an already-logged-in page, navigates through \"Add content\" > \"News article /\n// Blog post\" to reach the blog creation form. Tries several selector fallbacks at each\n// step since the exact link/button markup isn't guaranteed.\nasync function navigateToBlogCreation(page) {\n  // Wait for page to stabilize\n  await page.waitForTimeout(1000);\n  \n  // Look for \"Add content\" menu item or button - check both links and buttons\n  const addContentLocators = [\n    page.getByRole('link', { name: 'Add content' }),\n    page.getByRole('button', { name: 'Add content' }),\n    page.locator('a[href*=\"/node/add\"]'), // no accessible name to match on; href is the only signal\n    page.getByRole('link', { name: 'Add' }),\n  ];\n\n  let addContentClicked = false;\n  for (const locator of addContentLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"Add content\"');\n      addContentClicked = true;\n      await page.waitForTimeout(500);\n      break;\n    }\n  }\n  \n  if (!addContentClicked) {\n    throw new Error('Could not find \"Add content\" button/link');\n  }\n  \n  // Click on \"News article / Blog post\" option\n  const blogPostLocators = [\n    page.getByRole('link', { name: 'News article' }),\n    page.getByRole('link', { name: 'Blog post' }),\n    page.getByRole('link', { name: /News article.*Blog post|Blog post.*News/ }),\n    page.locator('li').filter({ hasText: /News article.*Blog post|Blog post/ }), // no interactive role on a bare <li>\n  ];\n\n  let found = false;\n  for (const locator of blogPostLocators) {\n    const element = locator.first();\n    if (await element.count() > 0) {\n      await element.click();\n      console.log('✓ Clicked \"News article / Blog post\"');\n      found = true;\n      break;\n    }\n  }\n  \n  if (!found) {\n    throw new Error('Could not find \"News article / Blog post\" option');\n  }\n  \n  // Wait for blog creation form to load\n  await page.waitForSelector('form, input[type=\"text\"]', { timeout: 5000 });\n  console.log('✓ Blog creation form loaded');\n}\n\n// loginWithMathChallenge: legacy, heuristic-based login (see comment above it)\n// login: standard login for valid credentials, asserts success\n// attemptInvalidLogin: login for credentials expected to fail, no success assertion\n// logout: ends the session\n// navigateToBlogCreation: from a logged-in page, reaches the blog creation form\nmodule.exports = {\n  loginWithMathChallenge,\n  login,\n  attemptInvalidLogin,\n  logout,\n  navigateToBlogCreation,\n};\n"
  assert:
  - type: javascript
    value: |
      return !/['"]mimrad-0cidCy-kadhirreeeet['"]/.test(output);
  - type: llm-rubric
    value: |-
      The output should be a Playwright test script (JavaScript) that automates TestCollab case TC-1578199 ("Attempt to login with invalid credentials"). It should:
      - Cover every numbered step above and assert its "Expected" outcome using Playwright's expect().
      - Prefer accessible locators (getByRole, getByLabel, getByText) over raw CSS or XPath selectors.
      - Not hardcode any credentials or secrets as literal strings; read them from environment variables if login is required.
      - Use awaited async Playwright APIs throughout (no dangling promises).

      For reference, here is the existing script already implemented in this repository for this test case. Use it, and the helper module(s) below that it imports, as additional context on established locator patterns, real page structure, and behavior already verified live in this codebase. The output does not need to match this reference verbatim, but should be at least as correct and should not contradict verified facts recorded in the helpers (e.g. real hrefs, accessible names, or field requirements):

      --- Existing script: attempt-to-login-with-invalid-credentials.spec.js ---
      {{scriptContent}}

      --- Imported helper module(s) ---
      {{helperContent}}
- description: featured-news-section.spec.js
  vars:
    testCaseId: '1601867'
    testCaseTitle: Homepage - 'Featured news' section
    steps: |
      1. Navigate to https://test.registertovote.london/ and scroll to the 'Featured news' section
         Expected: 'Featured news' heading (h2) is visible; section shows between 1 and 2 cards, never more
      2. Inspect both cards: each has a visible image with non-empty alt text, a non-empty heading, non-empty summary text, and a real link (not '#')
         Expected: Both cards have valid structure per the above
      3. Click the first card (the whole card is a single link) and confirm it navigates to a real article, then go back
         Expected: Browser navigates to a real /blogs-and-news/... article, not a 404; Back returns to the homepage
      4. Resize the viewport to 375x812 (mobile) and re-check the section
         Expected: Both cards remain visible, images/headings/summaries stay legible, no overlap or cut-off content
    scriptContent: |
      // spec: specs/tc-1601867-featured-news-plan.md
      // seed: tests/seed.spec.ts
      // NOTE: excludes case step 14 (screenshot/baseline comparison) — no visual-regression
      // baseline exists in this repo, same as tc-1601826/tc-1601858/tc-1601860.

      const { test } = require('@playwright/test');
      const {
        HOME_URL,
        expectFeaturedNewsLoaded,
        expectAllCardsValid,
        expectCardNavigatesAndBack,
      } = require('../helpers/featuredNewsHelper');

      test.describe('Homepage Featured News', () => {
        test("Homepage - 'Featured news' section", async ({ page }) => {
          // 1-3. Navigate to the homepage, scroll to Featured news, confirm heading + card count (1-2)
          await page.goto(HOME_URL);
          await expectFeaturedNewsLoaded(page);

          // 4, 7. Inspect both cards: image, heading, summary
          await expectAllCardsValid(page);

          // 5-6. Click the first card and confirm it navigates to a real article, then back
          await expectCardNavigatesAndBack(page, 0);
        });
      });
    helperContent: |
      // tests/helpers/featuredNewsHelper.js
      const { expect } = require('@playwright/test');

      const HOME_URL = 'https://test.registertovote.london/';

      function featuredNewsSection(page) {
        return page.locator('section, div').filter({ has: page.getByRole('heading', { name: 'Featured news' }) }).first();
      }

      function featuredNewsCards(page) {
        const section = featuredNewsSection(page);
        return section.getByRole('link').filter({ has: page.getByRole('heading', { level: 3 }) });
      }

      async function expectFeaturedNewsLoaded(page) {
        await expect(page.getByRole('heading', { name: 'Featured news' })).toBeVisible();
        const count = await featuredNewsCards(page).count();
        expect(count).toBeGreaterThanOrEqual(1);
        expect(count).toBeLessThanOrEqual(2);
      }

      // Verifies every card has a real image (non-empty alt), a non-empty heading,
      // non-empty summary text, and a real (non-'#') link.
      async function expectAllCardsValid(page) {
        const cards = featuredNewsCards(page);
        const count = await cards.count();
        for (let i = 0; i < count; i++) {
          const card = cards.nth(i);
          const image = card.getByRole('img').first();
          await expect(image).toBeVisible();
          expect(await image.getAttribute('alt')).toBeTruthy();

          const heading = card.getByRole('heading', { level: 3 });
          await expect(heading).not.toBeEmpty();

          const href = await card.getAttribute('href');
          expect(href).toBeTruthy();
          expect(href).not.toBe('#');
        }
      }

      // Clicks the given card (0-indexed), confirms it navigates to a real page, then goes back.
      async function expectCardNavigatesAndBack(page, index = 0) {
        const card = featuredNewsCards(page).nth(index);
        await card.click();
        await expect(page).not.toHaveURL(HOME_URL);
        await page.goBack();
        await expect(page).toHaveURL(HOME_URL);
      }

      module.exports = {
        HOME_URL,
        featuredNewsCards,
        expectFeaturedNewsLoaded,
        expectAllCardsValid,
        expectCardNavigatesAndBack,
      };
