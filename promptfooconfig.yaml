- description: verify-that-all-required-specs-is-displayed-when-creating-a-generic-content-page.spec.js
  vars:
    testCaseId: '1578344'
    testCaseTitle: Verify That All Required Specs Is Displayed When Creating A Generic Content Page
    steps: |
      1. Log in as Admin using credentials from process.env.TC_ADMIN_USER / process.env.TC_ADMIN_PASS (math-challenge login applies)
         Expected: Login succeeds and the site administration toolbar is visible
      2. Navigate to Add content (/node/add)
         Expected: The content-type picker lists 'Generic page' among the options
      3. Click 'Generic page'
         Expected: Navigates to /node/add/page; heading 'Create Generic page' is displayed
      4. Verify the Title field is present and marked required (accessible name 'Title *')
         Expected: Title field is visible and required
      5. Verify the Summary field is present and marked required (accessible name 'Summary *')
         Expected: Summary field is visible and required
      6. Verify the Body field (rich text editor) is present and not marked required
         Expected: Body field is visible with no required indicator
      7. Fill Title with a unique timestamped value and Summary with a unique value; leave Body empty
         Expected: Both fields accept the input
      8. Click 'Save & Close'
         Expected: No validation error blocks save (Body being empty is accepted); the page redirects away from the add form; the new title is visible on the resulting content view/edit page
    scriptContent: |
      // spec: specs/tc-1578344-generic-page-plan.md
      // seed: tests/seed.spec.ts

      const { test, expect } = require('@playwright/test');
      const { login, logout } = require('../helpers/authHelper');
      const {
        openGenericPageForm,
        expectGenericPageFieldRequirements,
        createGenericPage,
      } = require('../helpers/contentPageHelper');

      test.describe('Generic Page Creation', () => {
        // The admin account this test logs in with only permits one active session at a time.
        // Running it across multiple browser projects in parallel makes each login kick the
        // others out mid-test, producing intermittent 403s unrelated to the app itself.
        test.skip(
          ({ browserName }) => browserName !== 'chromium',
          'Shared single-session admin account — runs on chromium only to avoid concurrent logins'
        );

        test.afterEach(async ({ page }) => {
          // Drupal only allows one active session for this account; a closed browser context
          // doesn't end the server-side session, so log out explicitly even if the test failed.
          await logout(page);
        });

        test('Verify That All Required Specs Is Displayed When Creating A Generic Content Page', async ({ page }) => {
          // GIVEN User Is LoggedIn As An Admin
          await login(page, process.env.TC_ADMIN_USER, process.env.TC_ADMIN_PASS);

          // WHEN the User creates a new Generic Content Page
          await openGenericPageForm(page);

          // AND the following fields (Title, Summary, Body) should be visible to the User,
          // with Title and Summary mandatory and Body optional
          await expectGenericPageFieldRequirements(page);

          // THEN the User will be able to create a Generic Content Page
          const title = `Generic page ${Date.now()}`;
          await createGenericPage(page, title, 'Automated test summary');
          await expect(page).not.toHaveURL(/\/node\/add\/page$/);
          await expect(page.getByText(title)).toBeVisible();
        });
      });
