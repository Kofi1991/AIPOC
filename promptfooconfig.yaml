- description: translate-functionality.spec.js
  vars:
    testCaseId: '1571006'
    testCaseTitle: Translate functionality
    steps: |
      1. Navigate to the login page at https://test.registertovote.london/user/login
         Expected: Login page is displayed with the Translate widget visible in the footer (Select Language combobox and Translate button)
      2. Select a language in the footer 'Select Language' combobox (e.g. Français)
         Expected: The combobox reflects the selected language; page content has not yet changed
      3. Click the 'Translate' button next to the language combobox
         Expected: The page content translates into the selected language, e.g. the page title changes from 'Log in | Democracy Hub' to the translated equivalent
    scriptContent: |
      // spec: specs/tc-1571006-translate-plan.md
      // seed: tests/seed.spec.ts

      const { test, expect } = require('@playwright/test');
      const {
        expectTranslateWidgetVisible,
        pickRandomLanguage,
        translateAndVerify,
      } = require('../helpers/translateHelper');

      test.describe('Translate Functionality', () => {
        test('Translate functionality', async ({ page }) => {
          // 1. Navigate to the login page
          await page.goto('https://test.registertovote.london/user/login', { waitUntil: 'domcontentloaded' });
          await expect(page.getByRole('heading', { name: 'Log in' })).toBeVisible();
          await expectTranslateWidgetVisible(page);

          // 2. Select any language at random
          const language = await pickRandomLanguage(page);

          // 3. Translate — page should translate to the language which was selected
          await translateAndVerify(page, language);
        });
      });
    helperContent: |
      // tests/helpers/translateHelper.js
      const { expect } = require('@playwright/test');

      function getLanguageSelect(page) {
        return page.getByRole('combobox', { name: 'Select Language' });
      }

      function getTranslateButton(page) {
        return page.getByRole('button', { name: 'Translate', exact: true });
      }

      async function expectTranslateWidgetVisible(page) {
        await expect(getLanguageSelect(page)).toBeVisible();
        await expect(getTranslateButton(page)).toBeVisible();
      }

      async function pickRandomLanguage(page) {
        const options = await getLanguageSelect(page).locator('option').allTextContents();
        const choices = options.filter((label) => !['Select Language', 'English', 'undefined'].includes(label));
        return choices[Math.floor(Math.random() * choices.length)];
      }

      // The Google Translate widget occasionally ignores a select+click pair (observed
      // flakiness in this third-party integration, guarded by reCAPTCHA on the page), so
      // retry the whole interaction until the title actually changes.
      async function translateAndVerify(page, language) {
        const originalTitle = await page.title();

        await expect(async () => {
          await getLanguageSelect(page).selectOption({ label: language });
          await getTranslateButton(page).click();
          await expect(page).not.toHaveTitle(originalTitle, { timeout: 5000 });
        }).toPass({ timeout: 45000 });
      }

      module.exports = {
        expectTranslateWidgetVisible,
        pickRandomLanguage,
        translateAndVerify,
      };
